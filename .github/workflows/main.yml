name: Validate portfolio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s css/portfolio.css
          test -s js/company-portfolio.js
          test -s js/portfolio.js
          test -s js/product-intelligence.js
          test -s samples/product_intelligence_sample.csv
      - name: Check JavaScript syntax
        run: |
          node --check js/company-portfolio.js
          node --check js/portfolio.js
          node --check js/product-intelligence.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
