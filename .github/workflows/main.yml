name: Validate portfolio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s css/portfolio.css
          test -s js/portfolio.js
          test -s samples/market_daily_sample.csv
      - name: Check JavaScript syntax
        run: node --check js/portfolio.js
